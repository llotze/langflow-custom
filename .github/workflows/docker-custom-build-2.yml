name: Docker Build & Push (Minimal)

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'docker_example/**'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

env:
  DOCKER_IMAGE: dlaiosa/xc475-graceful
  DOCKER_TAG: 'latest'

jobs:
  build-and-push:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/build_and_push.Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
            ${{ env.DOCKER_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Success
        run: |
          echo "✅ Image pushed successfully!"
          echo "Image: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"
          echo "Railway will/should auto-deploy this image within a few minutes!"